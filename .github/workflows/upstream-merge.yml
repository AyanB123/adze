# Upstream tracking bot for the Adze IDE. Implements the merge automation in
# ADR-0010 (docs/architecture/adr/0010-ide-fork-strategy.md).
#
# ─── THIS WORKFLOW HAS NEVER RUN ───────────────────────────────────────────
#
# `workflow_dispatch` is the only trigger and the `schedule:` block is commented
# out. A nightly job that fails every night trains maintainers to ignore CI, which
# is worse than not having the job.
#
# The two preconditions the earlier revision of this file listed are now met:
# apps/ide/patches/ and apps/ide/branding/product.delta.jq exist, and every
# action below is pinned to a commit SHA as SECURITY.md requires of any workflow
# granted write permissions. What is still missing is a maintainer running it once
# and reading the result. Until that happens nothing here is verified.
#
# ─── WHAT CHANGED, AND WHY ─────────────────────────────────────────────────
#
# The earlier revision merged upstream release tags directly into this repository.
# That cannot work: this repository and microsoft/vscode share no commit, so
# `git merge 1.135.0` refuses with "unrelated histories", and if it were forced
# it would import upstream's entire tree into a repository whose whole strategy is
# not to vendor it. The same revision then read
# `apps/ide/vscode/product.json` from the merge result, a path that is gitignored
# and never populated by a merge.
#
# ADR-0010 asks for a merge with rerere, and the coherent form of that for a patch
# series is a merge inside a scratch clone of upstream:
#
#   adze/patched  =  <currently pinned tag>  +  our patch series applied
#   then           git merge <new tag>       into adze/patched
#
# Now there is a real merge base, the conflicts are the genuine ones between our
# patches and upstream's changes, and rerere has something to learn. Nothing is
# merged into this repository. What lands here is a two-line commit: the new tag in
# apps/ide/UPSTREAM_TAG and its commit SHA in apps/ide/config.sh, plus any patch
# that had to be refreshed.
#
# ─── WHY IT EXISTS ─────────────────────────────────────────────────────────
#
# Upstream VS Code changed its release cadence from monthly to weekly in March
# 2026: monthly through 1.111.0 (2026-03-06), then 1.112.0 on 2026-03-17 and
# roughly 7-day gaps since. That is about 50 merge events per year instead of 12,
# so every maintenance estimate written against the monthly cadence is off by 4x.
# Not budgeting for that is what killed Void, and one engineer's continuous
# attention on upstream tracking is a cost this project accepts explicitly.
#
# The design keeps that cost proportional to our diff rather than to the tree:
#
#   * `git rerere` with a cached `rr-cache`, so a conflict resolved once by a
#     human is replayed automatically afterwards. The single appended import in
#     `workbench.common.main.ts` is the motivating case — 31 upstream commits in
#     5.8 months, and the same one-line resolution every time.
#   * `product.json` is never merged textually. It is regenerated by applying a
#     `jq` delta program to upstream's file, which converts the single largest
#     conflict source (29 upstream commits in 5.8 months) into a build step.
#   * The patch series is checked with `git apply --check` before anything else.
#     For a patch-series fork that is the actual early-warning signal, and it
#     names the specific patch that broke.
#   * Anything left unresolved gets a `needs-human` label and the conflict list,
#     never a silent auto-resolution. Guessing at a merge in security-relevant
#     editor code is not an acceptable failure mode.
#   * "Releases behind" is a tracked metric with an alert above 3, because
#     ADR-0010 treats sustained drift as a resourcing signal rather than a bug.

name: upstream-merge

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to merge (default: newest release tag)'
        required: false
        type: string
      dry_run:
        description: 'Attempt the merge and report, but open no pull request'
        required: false
        type: boolean
        default: true

  # Enable once this has completed manually at least once.
  # schedule:
  #   - cron: '0 6 * * *'

# Read-only by default. Only the job that opens a pull request is granted more,
# and it is granted the minimum that requires.
permissions:
  contents: read

concurrency:
  group: upstream-merge
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/microsoft/vscode.git
  PATCH_DIR: apps/ide/patches
  BRANDING_DELTA: apps/ide/branding/product.delta.jq
  TAG_FILE: apps/ide/UPSTREAM_TAG
  CONFIG_FILE: apps/ide/config.sh
  # Scratch clone of upstream. Outside the workspace so that nothing here can be
  # committed to this repository by accident.
  SCRATCH: ${{ github.workspace }}/../upstream-scratch
  # Above this, ADR-0010 says the problem is resourcing rather than tooling.
  RELEASES_BEHIND_ALERT: '3'
  DO_NOT_TRACK: '1'

jobs:
  # Refuses loudly rather than half-running.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check for a fork target
        id: check
        run: |
          missing=""
          [ -d "$PATCH_DIR" ] || missing="$missing $PATCH_DIR"
          [ -f "$BRANDING_DELTA" ] || missing="$missing $BRANDING_DELTA"
          [ -f "$TAG_FILE" ] || missing="$missing $TAG_FILE"

          if [ -n "$missing" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            {
              echo "### upstream-merge did not run"
              echo
              echo "The IDE fork target does not exist yet. Missing:"
              echo
              for path in $missing; do echo "- \`$path\`"; done
              echo
              echo "This is expected before milestone M4 — see docs/roadmap.md."
              echo "Nothing is wrong and no action is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"

      # The branding delta is the one part of the pipeline that can be checked
      # without a clone. Checking it here means a broken delta fails in seconds
      # rather than after the merge job has cloned 2 GB.
      - name: verify the branding delta
        if: steps.check.outputs.active == 'true'
        run: bash apps/ide/scripts/verify-product-delta.sh

  # Resolve the target tag and how far behind we are. Split out from the merge so
  # that "releases behind" is reported even when the merge itself fails, since the
  # metric is what ADR-0010 escalates on.
  target:
    name: resolve target
    needs: preflight
    if: needs.preflight.outputs.active == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      current: ${{ steps.resolve.outputs.current }}
      behind: ${{ steps.resolve.outputs.behind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refs only — no clone. Release tags are plain X.Y.Z; anything else upstream
      # tags (insiders builds, distro tags) must not be treated as a release.
      - name: resolve target tag and releases behind
        id: resolve
        run: |
          tags="$(git ls-remote --tags --refs "$UPSTREAM_REPO" \
                  | awk '{print $2}' | sed 's|refs/tags/||' \
                  | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -Vr || true)"
          if [ -z "$tags" ]; then
            echo "::error::no upstream release tags matched X.Y.Z — check the upstream remote"
            exit 1
          fi

          newest="$(printf '%s\n' "$tags" | head -n1)"
          requested='${{ inputs.upstream_tag }}'
          target="${requested:-$newest}"
          if ! printf '%s\n' "$tags" | grep -qxF "$target"; then
            echo "::error::requested tag '$target' is not an upstream release tag"
            exit 1
          fi

          sha="$(git ls-remote --tags --refs "$UPSTREAM_REPO" "refs/tags/$target" | awk '{print $1}')"
          current="$(tr -d ' \t\r\n' < "$TAG_FILE")"

          # Count release tags newer than the one we are pinned to. -1 means the
          # pinned tag is not a release tag upstream still publishes, which is its
          # own problem and must not be reported as "0 behind".
          behind="$(printf '%s\n' "$tags" \
            | awk -v cur="$current" 'BEGIN{n=0} $0==cur{print n; found=1; exit} {n++} END{if(!found) print -1}')"

          {
            echo "tag=$target"
            echo "sha=$sha"
            echo "current=$current"
            echo "behind=$behind"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| pinned | \`$current\` |"
            echo "| target | \`$target\` |"
            echo "| commit | \`$sha\` |"
            echo "| releases behind | $behind |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A tracked metric, not a log line. ADR-0010 revisits the whole fork
      # strategy if this stays above the threshold for two weeks.
      - name: alert on releases behind
        run: |
          behind='${{ steps.resolve.outputs.behind }}'
          if [ "$behind" = '-1' ]; then
            echo "::warning::the pinned tag '${{ steps.resolve.outputs.current }}' is not among upstream's release tags — cannot compute drift"
          elif [ "$behind" -gt "$RELEASES_BEHIND_ALERT" ]; then
            echo "::warning::$behind releases behind upstream, above the alert threshold of $RELEASES_BEHIND_ALERT. ADR-0010 treats this as a resourcing signal."
          fi

  # The cheap question, asked first: does the series still apply to the new tag?
  #
  # For a patch-series fork this is the whole early-warning system. It costs one
  # shallow clone and no build, and it names the patch that broke rather than
  # reporting that "the merge failed".
  patch-series:
    name: patch series applies
    needs: [preflight, target]
    runs-on: ubuntu-latest
    outputs:
      clean: ${{ steps.check.outputs.clean }}
      broken: ${{ steps.check.outputs.broken }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: fetch upstream at the target tag
        env:
          ADZE_IDE_BUILD_ROOT: ${{ github.workspace }}/../vscode-check
        run: |
          # 10-fetch-upstream.sh verifies the pinned tag's commit, which is not
          # what is wanted here: the point is to try a *different* tag. So the
          # clone is done directly and the tag comes from the target job.
          git clone --depth 1 --branch '${{ needs.target.outputs.tag }}' \
            --single-branch --no-tags \
            -c advice.detachedHead=false \
            "$UPSTREAM_REPO" "$ADZE_IDE_BUILD_ROOT"

      - name: check every enabled patch
        id: check
        env:
          ADZE_IDE_BUILD_ROOT: ${{ github.workspace }}/../vscode-check
        run: |
          broken=''
          enabled="$(find "$PATCH_DIR" -maxdepth 1 -name '*.patch' | sort)"

          if [ -z "$enabled" ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "broken=" >> "$GITHUB_OUTPUT"
            {
              echo "### Patch series"
              echo
              echo "No enabled patches. Every patch in \`$PATCH_DIR\` is a documented"
              echo "placeholder with a \`.patch.no\` suffix, so there is nothing that can"
              echo "break against \`${{ needs.target.outputs.tag }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for p in $enabled; do
            if git -C "$ADZE_IDE_BUILD_ROOT" apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$p" 2>/dev/null; then
              echo "ok   $(basename "$p")"
            else
              echo "::warning file=$p::does not apply to ${{ needs.target.outputs.tag }}"
              broken="$broken $(basename "$p")"
            fi
          done

          if [ -n "$broken" ]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi
          echo "broken=$broken" >> "$GITHUB_OUTPUT"

          {
            echo "### Patch series against \`${{ needs.target.outputs.tag }}\`"
            echo
            if [ -n "$broken" ]; then
              echo "These patches no longer apply:"
              echo
              for b in $broken; do echo "- \`$b\`"; done
              echo
              echo "Refresh each against the new tag, or disable it by renaming to"
              echo "\`.patch.no\` with the reason written inside the file."
            else
              echo "Every enabled patch still applies."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The merge, inside a scratch clone of upstream. Nothing is merged into this
  # repository — see the header.
  merge:
    name: merge upstream
    needs: [preflight, target, patch-series]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the tag-bump commit is pushed from here.
          fetch-depth: 0

      # rerere only pays off if the cache outlives the runner. Without this, every
      # run re-asks a human the same question about the same appended import line,
      # which is the exact toil this workflow exists to remove.
      #
      # restore + save rather than actions/cache: the combined action also saves at
      # post-job, so pairing it with an explicit save step makes two writes to one
      # key and the second fails. Splitting them makes the write conditional on the
      # merge having produced something worth caching.
      - name: restore rerere cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: |
            rerere-

      - name: clone upstream with history
        run: |
          # Not shallow. A merge base cannot be computed from a shallow clone, and
          # the merge base is the whole mechanism here.
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" "$SCRATCH"
          git -C "$SCRATCH" fetch --tags --no-recurse-submodules origin \
            '${{ needs.target.outputs.current }}' '${{ needs.target.outputs.tag }}'

      - name: configure the scratch clone
        run: |
          git -C "$SCRATCH" config user.name 'adze-upstream-bot'
          git -C "$SCRATCH" config user.email 'noreply@github.com'
          git -C "$SCRATCH" config rerere.enabled true
          git -C "$SCRATCH" config rerere.autoUpdate true
          # Share the cached resolutions with the scratch clone. rerere reads
          # $GIT_DIR/rr-cache, so the restored directory is linked into place.
          mkdir -p rr-cache
          ln -sfn "$(pwd)/rr-cache" "$SCRATCH/.git/rr-cache"

      # adze/patched = the currently pinned tag + our series. This is the branch
      # the new tag is merged into, and building it fresh each run means the
      # merge result depends only on committed state.
      - name: build the patched branch at the pinned tag
        run: |
          git -C "$SCRATCH" checkout -b adze/patched '${{ needs.target.outputs.current }}'
          applied=0
          for p in $(find "$PATCH_DIR" -maxdepth 1 -name '*.patch' | sort); do
            if git -C "$SCRATCH" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"; then
              git -C "$SCRATCH" add -A
              git -C "$SCRATCH" commit -q -m "adze: $(basename "$p")"
              applied=$((applied + 1))
            else
              echo "::error file=$p::does not apply to the currently pinned tag ${{ needs.target.outputs.current }}"
              echo "The series is broken at the tag it is pinned to, which is a"
              echo "problem independent of the upstream bump. Fix that first."
              exit 1
            fi
          done
          echo "applied $applied patch(es) at ${{ needs.target.outputs.current }}"

      - name: attempt the merge with rerere
        id: merge
        run: |
          if git -C "$SCRATCH" merge --no-edit --no-ff '${{ needs.target.outputs.tag }}'; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # rerere.autoUpdate stages what it recognised. Whatever is still
          # unmerged is genuinely new and needs a human.
          unresolved="$(git -C "$SCRATCH" diff --name-only --diff-filter=U || true)"
          # product.json is expected to conflict and is regenerated below, so it
          # is not a human problem.
          unresolved="$(printf '%s\n' "$unresolved" | grep -v '^product\.json$' || true)"
          {
            echo 'conflicts<<EOF'
            printf '%s\n' "$unresolved"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The #1 conflict source, handled mechanically. `jq -S` sorts keys so the
      # output is byte-stable across runs and the diff stays reviewable.
      #
      # Regenerated in the scratch clone, then thrown away with it. The generated
      # file is never committed anywhere: apps/ide/vscode/ is gitignored and the
      # build regenerates it. What is verified here is that the delta still
      # produces a valid, correct document against the new upstream file — which
      # is the thing that could actually break.
      - name: regenerate product.json from the delta
        run: |
          git -C "$SCRATCH" checkout --theirs -- product.json 2>/dev/null || true
          git -C "$SCRATCH" checkout '${{ needs.target.outputs.tag }}' -- product.json
          jq -S -f "$BRANDING_DELTA" "$SCRATCH/product.json" > "$SCRATCH/product.json.next"
          mv "$SCRATCH/product.json.next" "$SCRATCH/product.json"
          git -C "$SCRATCH" add product.json

      # ADR-0009: recommendation maps inherited from the Microsoft Marketplace
      # become recommendations for unclaimed namespaces on a different registry.
      # That is the vector used against four commercial forks in late 2025, so it
      # gates the merge rather than the release.
      #
      # Called directly rather than through `pnpm gallery:audit`: the script
      # imports only node builtins, so a workspace install would cost minutes to
      # change nothing about the result.
      - name: audit gallery recommendations
        run: |
          node scripts/audit-gallery-recommendations.mjs \
            --product "$SCRATCH/product.json" \
            --namespaces apps/ide/branding/gallery-namespaces.json

      # What actually lands in this repository: the pin. Two files, and any patch
      # a human refreshed on a follow-up commit to the same branch.
      - name: bump the pin
        id: bump
        run: |
          branch='upstream/merge-${{ needs.target.outputs.tag }}'
          git config user.name 'adze-upstream-bot'
          git config user.email 'noreply@github.com'
          git switch -c "$branch"

          printf '%s\n' '${{ needs.target.outputs.tag }}' > "$TAG_FILE"
          # The recorded commit is what 10-fetch-upstream.sh checks the tag
          # against, so a moved tag surfaces as a mismatch rather than as an
          # unexplained patch failure.
          sed -i \
            's|^ADZE_UPSTREAM_TAG_COMMIT=.*|ADZE_UPSTREAM_TAG_COMMIT="${{ needs.target.outputs.sha }}"|' \
            "$CONFIG_FILE"

          if git diff --quiet -- "$TAG_FILE" "$CONFIG_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already pinned to ${{ needs.target.outputs.tag }}; nothing to bump"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git add "$TAG_FILE" "$CONFIG_FILE"
          git commit -s -m "chore(ide): pin upstream ${{ needs.target.outputs.tag }}" \
            -m "Behind by ${{ needs.target.outputs.behind }} release(s) before this bump." \
            -m "Refs ADR-0010."

      - name: open pull request
        if: ${{ inputs.dry_run == false && steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch='${{ steps.bump.outputs.branch }}'
          git push --force-with-lease origin "$branch"

          conflicts='${{ steps.merge.outputs.conflicts }}'
          broken='${{ needs.patch-series.outputs.broken }}'

          body="Pins upstream to \`${{ needs.target.outputs.tag }}\` (\`${{ needs.target.outputs.sha }}\`)."$'\n\n'
          body="${body}Was ${{ needs.target.outputs.behind }} release(s) behind."$'\n\n'
          body="${body}\`product.json\` was regenerated from \`$BRANDING_DELTA\` against the new upstream file and audited; it is not committed, because \`apps/ide/vscode/\` is gitignored and the build regenerates it."$'\n'

          labels='upstream'
          if [ -n "$(printf '%s' "$broken" | tr -d '[:space:]')" ]; then
            labels='upstream,needs-human'
            body="${body}"$'\n''### Patches that no longer apply'$'\n\n'
            for b in $broken; do body="${body}- \`$b\`"$'\n'; done
            body="${body}"$'\n''Refresh each against the new tag, or disable it by renaming to `.patch.no` with the reason inside the file.'$'\n'
          fi

          if [ -n "$(printf '%s' "$conflicts" | tr -d '[:space:]')" ]; then
            labels='upstream,needs-human'
            body="${body}"$'\n''### Unresolved merge conflicts'$'\n\n''```'$'\n'"${conflicts}"$'\n''```'$'\n\n'
            body="${body}These are new to \`rerere\`. Resolve them once on a scratch clone; the resolution is cached and replayed on later merges."$'\n'
          fi

          gh pr create \
            --title "chore(ide): pin upstream ${{ needs.target.outputs.tag }}" \
            --body "$body" \
            --label "$labels" \
            --base main \
            --head "$branch"

      # Only worth caching if the merge produced resolutions. Saving on every run
      # fills the cache with copies of the same thing under different keys.
      - name: persist rerere cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rr-cache
          key: rerere-${{ github.run_id }}
