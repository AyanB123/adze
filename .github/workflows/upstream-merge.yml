# Upstream tracking bot for the Adze IDE. Implements the merge automation in
# ADR-0010 (docs/architecture/adr/0010-ide-fork-strategy.md).
#
# ─── THIS WORKFLOW IS INACTIVE UNTIL MILESTONE M4 ───────────────────────────
#
# There is no fork target in the repository yet. `apps/ide/patches/` does not
# exist, and `apps/ide/vscode/` is a gitignored checkout that nothing populates.
# So the `schedule:` trigger below is commented out deliberately: a nightly job
# that fails every night trains maintainers to ignore CI, which is a worse
# outcome than not having the job.
#
# It is committed now anyway, for two reasons. The merge strategy is reviewable
# alongside the ADR that specifies it rather than six weeks later under time
# pressure, and enabling it at M4 is uncommenting the schedule block instead of
# writing a workflow while already behind upstream.
#
# Before enabling, two things are required:
#
#   1. `apps/ide/patches/` and `apps/ide/branding/product.delta.jq` must exist.
#      The preflight job below refuses to run without them.
#   2. Every action used here must be pinned to a commit SHA. This workflow is
#      the first one in the repository that needs `contents: write` and
#      `pull-requests: write`, and SECURITY.md makes SHA pinning mandatory before
#      a workflow is granted write permissions. Major tags are acceptable in
#      ci.yml precisely because nothing there can write.
#
# ─── WHY IT EXISTS ─────────────────────────────────────────────────────────
#
# Upstream VS Code changed its release cadence from monthly to weekly in March
# 2026: monthly through 1.111.0 (2026-03-06), then 1.112.0 on 2026-03-17 and
# roughly 7-day gaps since. That is about 50 merge events per year instead of 12,
# so every maintenance estimate written against the monthly cadence is off by 4x.
# Not budgeting for that is what killed Void, and one engineer's continuous
# attention on upstream tracking is a cost this project accepts explicitly.
#
# The design keeps that cost proportional to our diff rather than to the tree:
#
#   * `git rerere` with a cached `rr-cache`, so a conflict resolved once by a
#     human is replayed automatically afterwards. The single appended import in
#     `workbench.common.main.ts` is the motivating case.
#   * `product.json` is never merged textually. It is regenerated by applying a
#     `jq` delta program to upstream's file, which converts the single largest
#     conflict source (29 upstream commits in 5.8 months) into a build step.
#   * Anything left unresolved gets a `needs-human` label and the conflict list,
#     never a silent auto-resolution. Guessing at a merge in security-relevant
#     editor code is not an acceptable failure mode.
#   * "Releases behind" is a tracked metric with an alert above 3, because
#     ADR-0010 treats sustained drift as a resourcing signal rather than a bug.

name: upstream-merge

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to merge (default: newest release tag)'
        required: false
        type: string
      dry_run:
        description: 'Attempt the merge and report, but open no pull request'
        required: false
        type: boolean
        default: true

  # Enable at M4, once the two preconditions in the header comment are met.
  # schedule:
  #   - cron: '0 6 * * *'

# Read-only by default. Only the job that opens a pull request is granted more,
# and it is granted the minimum that requires.
permissions:
  contents: read

concurrency:
  group: upstream-merge
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/microsoft/vscode.git
  PATCH_DIR: apps/ide/patches
  BRANDING_DELTA: apps/ide/branding/product.delta.jq
  # Above this, ADR-0010 says the problem is resourcing rather than tooling.
  RELEASES_BEHIND_ALERT: '3'
  DO_NOT_TRACK: '1'

jobs:
  # Refuses loudly rather than half-running. Until M4 this is the only job that
  # executes, and its whole purpose is to say why.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v5

      - name: check for a fork target
        id: check
        run: |
          missing=""
          [ -d "$PATCH_DIR" ] || missing="$missing $PATCH_DIR"
          [ -f "$BRANDING_DELTA" ] || missing="$missing $BRANDING_DELTA"

          if [ -n "$missing" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            {
              echo "### upstream-merge did not run"
              echo
              echo "The IDE fork target does not exist yet. Missing:"
              echo
              for path in $missing; do echo "- \`$path\`"; done
              echo
              echo "This is expected before milestone M4 — see docs/roadmap.md."
              echo "Nothing is wrong and no action is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"

  merge:
    name: merge upstream
    needs: preflight
    if: needs.preflight.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a merge base cannot be computed from a shallow clone.
          fetch-depth: 0

      # rerere only pays off if the cache outlives the runner. Without this,
      # every run re-asks a human the same question about the same appended
      # import line, which is the exact toil this workflow exists to remove.
      - name: restore rerere cache
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: |
            rerere-

      - name: configure git
        run: |
          git config user.name 'adze-upstream-bot'
          git config user.email 'noreply@github.com'
          git config rerere.enabled true
          git config rerere.autoUpdate true
          # product.json is regenerated, never merged. The driver keeps a textual
          # merge from ever being attempted on it.
          git config merge.ours.driver true

      - name: fetch upstream release tags
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || true
          git fetch --tags --no-recurse-submodules upstream

      # Release tags are plain `X.Y.Z`. Anything else upstream tags (insiders
      # builds, distro tags) must not be treated as a release.
      - name: resolve target tag and releases behind
        id: target
        run: |
          requested='${{ inputs.upstream_tag }}'
          tags="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -z "$tags" ]; then
            echo "::error::no upstream release tags matched X.Y.Z — check the upstream remote"
            exit 1
          fi

          newest="$(printf '%s\n' "$tags" | head -n1)"
          target="${requested:-$newest}"
          if ! printf '%s\n' "$tags" | grep -qxF "$target"; then
            echo "::error::requested tag '$target' is not an upstream release tag"
            exit 1
          fi

          current="$(cat apps/ide/UPSTREAM_TAG 2>/dev/null || echo '')"
          if [ -n "$current" ]; then
            behind="$(printf '%s\n' "$tags" | awk -v cur="$current" 'BEGIN{n=0} $0==cur{print n; found=1; exit} {n++} END{if(!found) print -1}')"
          else
            behind=-1
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Target $target; currently pinned '${current:-unknown}'; $behind release(s) behind." >> "$GITHUB_STEP_SUMMARY"

      # Tracked metric, not a log line. ADR-0010 revisits the whole fork strategy
      # if this stays above the threshold for two weeks.
      - name: alert on releases behind
        if: steps.target.outputs.behind != '-1'
        run: |
          behind='${{ steps.target.outputs.behind }}'
          if [ "$behind" -gt "$RELEASES_BEHIND_ALERT" ]; then
            echo "::warning::$behind releases behind upstream, above the alert threshold of $RELEASES_BEHIND_ALERT. ADR-0010 treats this as a resourcing signal."
          fi

      - name: attempt merge with rerere
        id: merge
        run: |
          git switch -c "upstream/merge-${{ steps.target.outputs.target }}"
          if git merge --no-edit --no-ff "${{ steps.target.outputs.target }}"; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # rerere.autoUpdate stages what it recognised. Whatever is still
          # unmerged is genuinely new and needs a human.
          unresolved="$(git diff --name-only --diff-filter=U || true)"
          # product.json is expected to conflict and is regenerated below, so it
          # is not a human problem.
          unresolved="$(printf '%s\n' "$unresolved" | grep -v '^apps/ide/vscode/product\.json$' || true)"
          {
            echo 'conflicts<<EOF'
            printf '%s\n' "$unresolved"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The #1 conflict source, handled mechanically. `jq -S` sorts keys so the
      # output is byte-stable across runs and the diff stays reviewable.
      - name: regenerate product.json
        run: |
          test -f apps/ide/vscode/product.json
          jq -S -f "$BRANDING_DELTA" apps/ide/vscode/product.json > product.json.next
          mv product.json.next apps/ide/vscode/product.json
          git add apps/ide/vscode/product.json

      # ADR-0009: recommendation maps inherited from the Microsoft Marketplace
      # become recommendations for unclaimed namespaces on a different registry.
      # That is the vector used against four commercial forks in late 2025, so it
      # gates the merge rather than the release.
      - name: audit gallery recommendations
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm gallery:audit

      - name: open pull request
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="upstream/merge-${{ steps.target.outputs.target }}"
          git push --force-with-lease origin "$branch"

          conflicts='${{ steps.merge.outputs.conflicts }}'
          body="$(printf 'Automated upstream merge to \140%s\140.\n\nBehind by: %s release(s).\n\n`product.json` was regenerated from `%s`, not merged.\n' \
            "${{ steps.target.outputs.target }}" "${{ steps.target.outputs.behind }}" "$BRANDING_DELTA")"

          labels='upstream'
          if [ -n "$(printf '%s' "$conflicts" | tr -d '[:space:]')" ]; then
            labels='upstream,needs-human'
            body="$body"$'\n''### Unresolved conflicts'$'\n\n''```'$'\n'"$conflicts"$'\n''```'$'\n\n''These are new to `rerere`. Resolve them locally on this branch; the resolution is then cached and replayed on later merges.'
          fi

          gh pr create \
            --title "chore(ide): merge upstream ${{ steps.target.outputs.target }}" \
            --body "$body" \
            --label "$labels" \
            --base main \
            --head "$branch"

      - name: persist rerere cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
