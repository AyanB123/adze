packages:
  - "packages/*"
  - "apps/vscode"
  - "apps/hub"
  - "bench/harness"
  - "bench/suites/*"
  - "plugins/*"

# Single source of truth for dependency versions across every workspace package.
# Adding a dep? Put the version here and reference it as `catalog:` from the
# package's package.json. This is what stops fifteen packages from drifting onto
# four different versions of zod.
#
# Versions below were resolved against the live npm registry, not from memory.
catalog:
  # --- Runtime ---
  zod: ^4.5.2
  ai: ^7.0.84
  "@ai-sdk/anthropic": ^4.0.45
  "@ai-sdk/openai": ^4.0.51
  "@ai-sdk/openai-compatible": ^3.0.40
  "@modelcontextprotocol/sdk": ^1.30.0
  "@vscode/ripgrep": ^1.18.0
  web-tree-sitter: ^0.26.13
  commander: ^15.0.0
  picocolors: ^1.1.1
  picomatch: ^4.0.7
  yaml: ^2.9.0
  jsonc-parser: ^3.3.1

  # --- Dev ---
  typescript: ^7.0.2
  "@types/node": ^26.4.0
  "@types/picomatch": ^4.0.3
  "@biomejs/biome": ^2.5.11
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  tsup: ^8.5.1
  turbo: ^2.10.12
  "@changesets/cli": ^3.0.1
  # Packaging a VSIX. MIT, dev-only, never shipped inside the artifact.
  # Note: `ovsx` is deliberately absent: it is EPL-2.0, which this repo forbids.
  # Publishing to Open VSX invokes it through `pnpm dlx`, so it never enters the
  # dependency graph. See apps/vscode/README.md.
  "@vscode/vsce": ^3.9.2

# Only these packages may run install scripts. Anything else is denied by
# default: a postinstall script is the cheapest supply-chain attack there is,
# and this repo has a hard rule that new native deps get reviewed.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@vscode/ripgrep"
  - esbuild
